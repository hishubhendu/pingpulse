version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pingpulse_db
    environment:
      POSTGRES_DB: pingpulse_db
      POSTGRES_USER: pingpulse_user
      POSTGRES_PASSWORD: pingpulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pingpulse_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: pingpulse_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: pingpulse_worker
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: pingpulse_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: